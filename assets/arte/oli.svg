<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="oliT">
  <title id="oliT">Oro líquido: el aceite del Penedès</title>
  <defs>
    <linearGradient id="oFons" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d13"/><stop offset=".6" stop-color="#171410"/><stop offset="1" stop-color="#20190f"/>
    </linearGradient>
    <radialGradient id="oGota" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#ffe6ae"/><stop offset=".45" stop-color="#e8b956"/><stop offset="1" stop-color="#9c6d20"/>
    </radialGradient>
    <radialGradient id="oHalo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d9a441" stop-opacity=".30"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oLinia" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55744b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7fa06d" stop-opacity=".85"/>
      <stop offset="1" stop-color="#55744b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#oFons)"/>
  <circle cx="430" cy="300" r="300" fill="url(#oHalo)"/>

  <!-- Filas de olivos vistas como curvas de nivel -->
  <g fill="none" stroke="url(#oLinia)" stroke-linecap="round">
    <path d="M-30 196 Q400 146 830 200" stroke-width="1.6" opacity=".55"/>
    <path d="M-30 250 Q400 192 830 258" stroke-width="2"   opacity=".65"/>
    <path d="M-30 318 Q400 250 830 330" stroke-width="2.6" opacity=".75"/>
    <path d="M-30 400 Q400 318 830 416" stroke-width="3.2" opacity=".7"/>
    <path d="M-30 496 Q400 396 830 516" stroke-width="4"   opacity=".55"/>
  </g>

  <!-- Copas, como puntos sobre las curvas -->
  <g fill="#6f9160">
    <circle cx="150" cy="243" r="5" opacity=".55"/><circle cx="330" cy="212" r="6" opacity=".7"/>
    <circle cx="520" cy="216" r="5.5" opacity=".6"/><circle cx="690" cy="244" r="5" opacity=".5"/>
    <circle cx="120" cy="306" r="7" opacity=".6"/><circle cx="300" cy="266" r="8" opacity=".8"/>
    <circle cx="560" cy="272" r="7.5" opacity=".7"/><circle cx="730" cy="312" r="6.5" opacity=".55"/>
    <circle cx="190" cy="378" r="9" opacity=".6"/><circle cx="640" cy="386" r="8.5" opacity=".55"/>
  </g>

  <!-- La gota: el intangible que se mira -->
  <g transform="translate(400 336)">
    <path d="M0 -142 C62 -56 106 -4 106 56 A106 106 0 0 1 -106 56 C-106 -4 -62 -56 0 -142Z"
          fill="url(#oGota)"/>
    <path d="M-44 26 A54 54 0 0 0 10 80" stroke="#fff" stroke-opacity=".55"
          stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="-34" cy="-34" rx="20" ry="30" fill="#fff" opacity=".22" transform="rotate(-22 -34 -34)"/>
  </g>

  <!-- Reflejo en el suelo -->
  <ellipse cx="400" cy="516" rx="150" ry="14" fill="#d9a441" opacity=".16"/>
</svg>
