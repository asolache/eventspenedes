# Configuración de despliegue de eventspenedes.com
# Sitio estático: no hay build, se publica la raíz del repositorio tal cual.

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

# La función que lleva los envíos de formulario a Zoho. Netlify la encuentra
# aquí por convención, pero declararlo evita sorpresas si algún día cambia.
[functions]
  directory = "netlify/functions"

# Cabeceras de seguridad y caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Tipos de contenido explícitos para los ficheros que leen rastreadores
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# La página privada del borrador de una propuesta. El enlace lleva el evento
# dentro, cifrado, así que no hay identificador que adivinar: sin la clave del
# sitio no se abre. La función pone sus propias cabeceras —noindex y no-store—
# porque lo que sirve son datos de un cliente.
[[redirects]]
  from = "/p"
  to = "/.netlify/functions/borrador"
  status = 200

# La ficha de localización es una herramienta de trabajo, no una página: no se
# indexa, y su enlace puede llevar datos de contacto prerrellenados en la URL,
# así que no viaja en el Referer ni se queda en ninguna caché.
[[headers]]
  for = "/alta-localizacion*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[redirects]]
  from = "/alta-localizacion"
  to = "/alta-localizacion.html"
  status = 200

# Dominio canónico: todo el tráfico de www va al dominio raíz
[[redirects]]
  from = "https://www.eventspenedes.com/*"
  to = "https://eventspenedes.com/:splat"
  status = 301
  force = true

# URLs sin extensión. Un enlace compartido a mano se escribe sin «.html», y sin
# estas reglas acaba en el 404 —que además, con rutas relativas, salía sin
# estilos—.
#
# Son REESCRITURAS (200) y no redirecciones (301) a propósito: Netlify puede
# tener activadas las «Pretty URLs», que hacen lo contrario —quitar el .html—,
# y dos reglas opuestas acaban en bucle o en el 404. Una reescritura sirve el
# fichero sin redirigir, así que no hay con qué chocar. Que la misma página
# responda en dos URLs no es problema: cada una lleva su `canonical`.

[[redirects]]
  from = "/dj"
  to = "/dj.html"
  status = 200

[[redirects]]
  from = "/ca/dj"
  to = "/ca/dj.html"
  status = 200

[[redirects]]
  from = "/en/dj"
  to = "/en/dj.html"
  status = 200

[[redirects]]
  from = "/agencias"
  to = "/agencias.html"
  status = 200

[[redirects]]
  from = "/ca/agencias"
  to = "/ca/agencias.html"
  status = 200

[[redirects]]
  from = "/en/agencias"
  to = "/en/agencias.html"
  status = 200

[[redirects]]
  from = "/propuesta"
  to = "/propuesta.html"
  status = 200

[[redirects]]
  from = "/ca/propuesta"
  to = "/ca/propuesta.html"
  status = 200

[[redirects]]
  from = "/en/propuesta"
  to = "/en/propuesta.html"
  status = 200

[[redirects]]
  from = "/gracias"
  to = "/gracias.html"
  status = 200

[[redirects]]
  from = "/ca/gracias"
  to = "/ca/gracias.html"
