# Configuración de despliegue de eventspenedes.com
# Sitio estático: no hay build, se publica la raíz del repositorio tal cual.

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

# Cabeceras de seguridad y caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Tipos de contenido explícitos para los ficheros que leen rastreadores
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# Dominio canónico: todo el tráfico de www va al dominio raíz
[[redirects]]
  from = "https://www.eventspenedes.com/*"
  to = "https://eventspenedes.com/:splat"
  status = 301
  force = true

# URLs sin extensión. Un enlace compartido a mano se escribe sin «.html», y sin
# estas reglas acaba en el 404 —que además, con rutas relativas, salía sin
# estilos—. Redirección permanente a la página real: una sola URL canónica.

[[redirects]]
  from = "/dj"
  to = "/dj.html"
  status = 301

[[redirects]]
  from = "/ca/dj"
  to = "/ca/dj.html"
  status = 301

[[redirects]]
  from = "/en/dj"
  to = "/en/dj.html"
  status = 301

