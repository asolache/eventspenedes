name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Este sitio no tiene build ni dependencias, así que lo que puede romperse no
# son los paquetes: es la función que recibe los formularios —que se despliega
# sola y donde un fallo se traduce en leads perdidos sin que nadie se entere— y
# las versiones en catalán e inglés, que se generan y se versionan.
jobs:
  guardas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: La función de leads acepta lo legítimo y rechaza lo demás
        run: node tools/test-lead.mjs

      - name: El borrador se monta solo y no se abre con otro enlace
        run: node tools/test-borrador.mjs

      # El tablero interno usa el CRM a través del sitio: que sin su clave no
      # responda y que con ella solo lea y escriba lo de su lista.
      - name: El tablero solo entra con su clave y solo hace lo de su lista
        run: node tools/test-tablero.mjs

      # El tablero interno lee la facturación de B2Brouter a través del sitio:
      # que sin su clave no responda y que con ella solo lea y cree borradores.
      - name: B2Brouter solo responde con su clave, lee y solo crea borradores
        run: node tools/test-tablero-b2b.mjs

      # La importación de catálogos lee webs ajenas desde nuestro servidor y
      # escribe en una ficha que acaba en un presupuesto: que no salga a la red
      # interna y que no ponga nada que la fuente no diga.
      - name: La importación de catálogos solo pone lo que la fuente dice
        run: node tools/test-importar.mjs

      # Las páginas públicas de los partners salen de su ficha aprobada: que
      # solo publiquen lo autorizado, sin precios ni contactos.
      - name: Las páginas de partners solo publican lo autorizado
        run: node tools/test-partners.mjs

      # El portal habla con Zoho por el servidor: que un partner no lea nada
      # de Zoho ni pase mensajes ajenos, y que cada respuesta llegue al trato.
      - name: El portal solo habla con Zoho por quien debe
        run: node tools/test-portal.mjs

      - name: La cabecera de las páginas de partners es la del sitio
        run: |
          node tools/build-marco.mjs
          git diff --exit-code -- netlify/portal/marco.mjs || {
            echo "::error::netlify/portal/marco.mjs no corresponde a red.html. Regenera con: node tools/build-marco.mjs"
            exit 1
          }

      # ca/ y en/ se generan del castellano. Si están desincronizadas, alguien
      # ha editado una página generada a mano y el próximo build se lo llevará
      # por delante. Las preguntas frecuentes de los datos estructurados de las
      # fuentes también se generan: tienen que ser las que se ven.
      - name: Las versiones por idioma son las que saldrían ahora
        run: |
          node tools/build-kit.mjs
          node tools/build-i18n.mjs
          git diff --exit-code -- ca/ en/ index.html dj.html agencias.html propuesta.html gracias.html privacidad.html red.html contacto.html valoracion.html kit-agencias.html js/lang-kit.js || {
            echo "::error::ca/, en/ o los datos estructurados no corresponden a las páginas en castellano. Regenera con: node tools/build-kit.mjs && node tools/build-i18n.mjs"
            exit 1
          }

      # Los campos de las fichas de localización y de proveedor salen del mismo
      # esquema que la ficha que llega a Zoho. Si alguien los toca a mano, se
      # separan.
      - name: Los formularios de fichas son los que salen de su esquema
        run: |
          node tools/build-fichas.mjs
          git diff --exit-code -- alta-localizacion.html alta-proveedor.html || {
            echo "::error::alta-localizacion.html o alta-proveedor.html no corresponden a su esquema. Regenera con: node tools/build-fichas.mjs"
            exit 1
          }

      # La lista de recursos sale de data/recursos.json, que llega del índice
      # de documentación del repositorio privado. Nadie la escribe a mano.
      - name: La página de recursos es la que sale de los datos
        run: |
          node tools/build-recursos.mjs
          git diff --exit-code -- recursos.html || {
            echo "::error::recursos.html no corresponde a data/recursos.json. Regenera con: node tools/build-recursos.mjs"
            exit 1
          }
